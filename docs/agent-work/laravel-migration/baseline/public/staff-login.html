<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counseling Office Staff Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { min-height:100vh; background:linear-gradient(135deg,#eef6f8,#f8fafb); display:flex; align-items:center; justify-content:center; color:#263238; }
    .login-card { width:min(430px,92vw); background:#fff; border:1px solid #e4eaed; border-radius:18px; box-shadow:0 12px 40px rgba(23,74,91,.10); padding:32px; }
    .brand { width:56px;height:56px;border-radius:15px;background:#174a5b;color:#fff;display:flex;align-items:center;justify-content:center;font-size:25px;margin-bottom:18px; }
    .btn-primary { background:#174a5b;border-color:#174a5b; }
    .btn-primary:hover { background:#123b49;border-color:#123b49; }
    .demo-box { background:#f3f7f8;border:1px solid #e0eaed;border-radius:10px;padding:12px;font-size:.82rem;color:#60717a; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand"><i class="bi bi-heart-pulse"></i></div>
    <h1 class="h4 fw-bold mb-1">Counseling Office</h1>
    <p class="text-muted mb-4">Staff portal sign in</p>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Staff Email</label>
        <input type="email" class="form-control" id="email" value="counselor@university.edu" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" value="Counselor123!" required>
      </div>

      <div id="error" class="alert alert-danger d-none"></div>

      <button class="btn btn-primary w-100" type="submit" id="loginButton">
        Sign In
      </button>
    </form>

    <div class="demo-box mt-4">
      <strong>Prototype account</strong><br>
      counselor@university.edu<br>
      Counselor123!
      <div class="mt-1">Change this account and password before any real deployment.</div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = document.getElementById('loginButton');
      const error = document.getElementById('error');
      error.classList.add('d-none');
      button.disabled = true;
      button.textContent = 'Signing in...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Login failed.');
        window.location.href = '/office';
      } catch (err) {
        error.textContent = err.message;
        error.classList.remove('d-none');
      } finally {
        button.disabled = false;
        button.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

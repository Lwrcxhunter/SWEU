# Install as an Nginx site on Linux/WSL. Adjust /srv/buksu to your checkout.
# Loopback HTTP is for concurrent local testing. See README.md for HTTPS deployment.
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    root /srv/buksu/laravel/public;
    index index.php;
    charset utf-8;
    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/buksu.sock;
        fastcgi_read_timeout 65s;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }
}
